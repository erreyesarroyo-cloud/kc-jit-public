replicaCount: 1

image:
  repository: kcpimlabacr319.azurecr.io/pim
  tag: "0.5.2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Browser URL for the PIM UI (OIDC redirect_uri base). Set to Ingress IP at deploy time.
publicURL: "http://74.179.206.145"

# Lab: nginx Ingress (install ingress-nginx first). Keycloak keeps its LoadBalancer.
ingress:
  enabled: true
  className: nginx
  # Empty host = access via Ingress controller EXTERNAL-IP.
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls: []

# Cross-namespace: Keycloak stays in `keycloak`; PIM deploys to `keycloak-pim`.
keycloak:
  baseURL: "http://keycloak.keycloak.svc.cluster.local:8080"
  # Set at deploy time to the Keycloak Ingress URL for browser OIDC redirects.
  publicURL: "http://keycloak.74.179.206.145.nip.io"
  realm: pim-test
  clientId: pim-service
  existingSecret: pim-service-credentials
  clientSecretKey: client-secret

oidc:
  enabled: true
  clientId: pim-web
  existingSecret: pim-oidc-credentials
  clientSecretKey: client-secret
  # empty = publicURL + /auth/callback
  redirectURL: ""

sessionSecret: "lab-only-change-me"
allowHeaderAuth: true

# Non-secret runtime config is rendered into ConfigMap {{ include "pim.fullname" . }}-config
# (groups, TTLs, URLs, realm, OIDC flags). Secrets stay in K8s Secrets.
# After editing the CM: kubectl -n keycloak-pim rollout restart deploy/pim
configMap:
  enabled: true

# Rendered into ConfigMap pim-config (edit via Helm --set, or kubectl edit cm/pim-config then restart).
# These names must already exist in the Keycloak realm.
groups:
  eligible: admin-eligible
  active: admin-active
  permanent: admin-permanent
  breakGlass: break-glass

# Lab-friendly defaults — shorter for demos (override in CM or helm --set).
requestTTL: 30m
activeTTL: 4h
pollInterval: 15s

# Phase 4 — Slack/Teams incoming webhook (URL in secret, not values).
notify:
  enabled: true
  existingSecret: pim-notify-webhook
  webhookUrlKey: url

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
