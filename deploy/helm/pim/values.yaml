replicaCount: 1

image:
  # Build locally (`docker build -t keycloak-jit-access:0.1.0 .`) or point at your registry.
  repository: keycloak-jit-access
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Browser URL for the PIM UI (OIDC redirect_uri base). Override at deploy time.
publicURL: "http://localhost:8081"

# nginx Ingress (install ingress-nginx first). Keycloak typically keeps its LoadBalancer.
ingress:
  enabled: true
  className: nginx
  # Empty host = access via Ingress controller EXTERNAL-IP.
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls: []

# Cross-namespace: Keycloak stays in `keycloak`; PIM deploys to `keycloak-pim`.
keycloak:
  baseURL: "http://keycloak.keycloak.svc.cluster.local:8080"
  # Browser-facing Keycloak URL for OIDC redirects. Override at deploy time.
  publicURL: "http://localhost:8080"
  realm: pim-test
  clientId: pim-service
  existingSecret: pim-service-credentials
  clientSecretKey: client-secret

oidc:
  enabled: true
  clientId: pim-web
  existingSecret: pim-oidc-credentials
  clientSecretKey: client-secret
  # empty = publicURL + /auth/callback
  redirectURL: ""

# Required. Override with --set sessionSecret=... (do not ship the placeholder).
sessionSecret: ""
allowHeaderAuth: false

# Non-secret runtime config is rendered into ConfigMap {{ include "pim.fullname" . }}-config
# (groups, TTLs, URLs, realm, OIDC flags). Secrets stay in K8s Secrets.
# After editing the CM: kubectl -n keycloak-pim rollout restart deploy/pim
configMap:
  enabled: true

# Rendered into ConfigMap pim-config (edit via Helm --set, or kubectl edit cm/pim-config then restart).
# These names must already exist in the Keycloak realm.
groups:
  eligible: admin-eligible
  active: admin-active
  permanent: admin-permanent
  breakGlass: break-glass

# Chart defaults are shorter for demos. App defaults (compose / env) are 1h / 9h.
requestTTL: 30m
activeTTL: 4h
pollInterval: 15s

# Slack/Teams incoming webhook (URL in a Secret, not here).
notify:
  enabled: false
  existingSecret: pim-notify-webhook
  webhookUrlKey: url

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
