apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pim.fullname" . }}
  labels:
    {{- include "pim.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pim.fullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pim.fullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        {{- if .Values.configMap.enabled }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: pim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.configMap.enabled }}
          envFrom:
            - configMapRef:
                name: {{ include "pim.fullname" . }}-config
                optional: false
          {{- end }}
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DB_PATH
              value: /data/pim.db
            - name: SESSION_SECRET
              value: {{ required "Set sessionSecret (helm --set sessionSecret=...)" .Values.sessionSecret | quote }}
            - name: PIM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.keycloak.existingSecret }}
                  key: {{ .Values.keycloak.clientSecretKey }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.clientSecretKey }}
            {{- if and .Values.notify.enabled .Values.notify.existingSecret }}
            - name: NOTIFY_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.notify.existingSecret }}
                  key: {{ .Values.notify.webhookUrlKey }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pim.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
