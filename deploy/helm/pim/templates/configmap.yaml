{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pim.fullname" . }}-config
  labels:
    {{- include "pim.labels" . | nindent 4 }}
data:
  # Keycloak groups PIM controls. Names must exist in the realm (Phase 0 setup).
  GROUP_ADMIN_ELIGIBLE: {{ .Values.groups.eligible | quote }}
  GROUP_ADMIN_ACTIVE: {{ .Values.groups.active | quote }}
  GROUP_ADMIN_PERMANENT: {{ .Values.groups.permanent | quote }}
  GROUP_BREAKGLASS: {{ .Values.groups.breakGlass | quote }}
  REQUEST_TTL: {{ .Values.requestTTL | quote }}
  ACTIVE_TTL: {{ .Values.activeTTL | quote }}
  POLL_INTERVAL: {{ .Values.pollInterval | quote }}
  PUBLIC_URL: {{ .Values.publicURL | quote }}
  KC_BASE_URL: {{ .Values.keycloak.baseURL | quote }}
  {{- if .Values.keycloak.publicURL }}
  KC_PUBLIC_URL: {{ .Values.keycloak.publicURL | quote }}
  {{- end }}
  KC_REALM: {{ .Values.keycloak.realm | quote }}
  PIM_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  OIDC_ENABLED: {{ .Values.oidc.enabled | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  {{- if .Values.oidc.redirectURL }}
  OIDC_REDIRECT_URL: {{ .Values.oidc.redirectURL | quote }}
  {{- end }}
  ALLOW_HEADER_AUTH: {{ .Values.allowHeaderAuth | quote }}
{{- end }}
