{{- if not .Values.admin.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.secretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.admin.existingSecretUserKey }}: {{ .Values.admin.username | quote }}
  {{ .Values.admin.existingSecretPasswordKey }}: {{ .Values.admin.password | quote }}
{{- end }}
